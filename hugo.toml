baseURL = 'https://empcubed.msuperl.org/'
locale = 'en-us'
title = 'Projects & Practices in Physics — E&M'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

[[menu.main]]
  name = "Notes"
  url = "/notes/"
  weight = 1

[[menu.main]]
  name = "Examples"
  url = "/examples/"
  weight = 2

[[menu.main]]
  name = "PCubed"
  url = "https://pcubed.msuperl.org/"
  weight = 3
